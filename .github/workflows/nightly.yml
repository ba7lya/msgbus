# SPDX-License-Identifier: MIT
#
# Nightly canary, not a second vote: the push matrix already crosses OS x compiler x
# version x config x sanitizer, so repeating it would fail for the same reasons. This run
# instead takes today's vcpkg tool and keeps no binary cache -- ci.yml pins both -- so it
# answers "would a fresh machine still build this tree?" before a baseline bump finds out.
name: nightly

on:
  schedule:
    # 03:47 UTC, off the hour and the half: the top of the hour is the most contended
    # slot, where a delayed queue can push the run past the working day it should precede.
    - cron: "47 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  # a nightly is not worth cancelling
  cancel-in-progress: false

permissions:
  contents: read

env:
  VCPKG_DISABLE_METRICS: 1
  # 'clear' leaves vcpkg with no provider at all, which forces every port to build from
  # source -- exactly what a baseline bump would move, so rebuilding nightly is the point.
  VCPKG_BINARY_SOURCES: clear
  # the project's own build options, one per build-* option in the root CMakeLists
  MSGBUS_CONFIGURE_FLAGS: >-
    -Dba7lya.msgbus_BUILD_TEST=ON
    -Dba7lya.msgbus_BUILD_BENCHMARK=ON
    -Dba7lya.msgbus_BUILD_EXAMPLE=ON

jobs:
  win-msvc:
    # a vcpkg port builds with a different toolchain under MSVC than on Linux
    # the version is spelled out because a job's own `env` cannot be read from its `name`
    name: win-msvc-2026
    runs-on: windows-2025-vs2026
    # no binary cache means every port is compiled from source here, slowest of the three
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false

      # the toolset ci.yml names, selected by putting the matching cl.exe on PATH: the Ninja
      # generators ignore the preset's toolset field
      - uses: rzlamrr/msvc-dev-cmd@70b9da25ce35e6470a3bd4be4b4a1a4929a61925 # v2
        with:
          arch: x64
          vsversion: "2026"
          toolset: "14.51"

      # no vcpkgGitCommitId: the tool comes from run-vcpkg's default branch
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11

      - name: configure
        shell: cmd
        run: >
          cmake --preset win-msvc-2026-x64
          -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%/scripts/buildsystems/vcpkg.cmake
          "-DVCPKG_MANIFEST_FEATURES=test;benchmark"
          %MSGBUS_CONFIGURE_FLAGS%

      - name: build
        shell: cmd
        run: cmake --build --preset win-msvc-2026-x64-rel

      # no ASAN_OPTIONS=detect_leaks=1, as in ci.yml: msvc's asan runtime does not implement
      # leak detection. --output-junit resolves beside the binaries, not the checkout root.
      - name: test
        shell: cmd
        run: ctest --preset win-msvc-2026-x64-test -C Release --output-junit test-results.xml

      # the runtime artifacts of a configuration share one directory, so the loader finds the DLL
      - name: smoke the benchmarks
        shell: cmd
        run: >
          build\win-msvc-2026-x64\bin\Release\msgbus_benchmark.exe
          --benchmark_min_time=0.01s

      - name: smoke the examples
        shell: cmd
        run: build\win-msvc-2026-x64\bin\Release\msgbus_example_basic_matching.exe

      - name: upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-nightly-win-msvc
          path: build/win-msvc-2026-x64/test-results.xml
          retention-days: 7
          if-no-files-found: warn

  linux-gcc:
    # the version is spelled out: a job's own `env` context is not available to its `name`
    name: linux-gcc-16
    runs-on: ubuntu-24.04
    # the longest job in either workflow: no binary cache, so every port builds from source
    timeout-minutes: 120
    env:
      GCC_VERSION: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false

      - uses: ./.github/actions/setup-gcc
        with:
          version: ${{ env.GCC_VERSION }}

      # no vcpkgGitCommitId, unlike ci.yml: the tool comes from run-vcpkg's default branch, so a
      # vcpkg regression surfaces here; port versions stay pinned by vcpkg.json's baseline.
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11

      - name: configure
        run: >
          cmake --preset linux-gcc-x64
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          "-DVCPKG_MANIFEST_FEATURES=test;benchmark"
          $MSGBUS_CONFIGURE_FLAGS

      - name: build
        run: cmake --build --preset linux-gcc-x64-rel

      - name: test
        run: ctest --preset linux-gcc-x64-test -C Release --output-junit test-results.xml

      - name: smoke the benchmarks
        run: ./build/linux-gcc-x64/bin/Release/msgbus_benchmark --benchmark_min_time=0.01s

      - name: smoke the examples
        run: ./build/linux-gcc-x64/bin/Release/msgbus_example_basic_matching

      - name: upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-nightly-linux-gcc
          path: build/linux-gcc-x64/test-results.xml
          retention-days: 7
          if-no-files-found: warn

  linux-clang:
    # spelled out for the same reason as the gcc job: `name` cannot read the job's own env
    name: linux-clang-23-tsan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LLVM_VERSION: 23
      # the instrumented pass is the one worth repeating: a race this runner hides today is what
      # tomorrow's run is there to find, and the plain pass already ran on the push
      SAN: "-tsan"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false

      - uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}
          packages: clang-${{ env.LLVM_VERSION }}

      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11

      - name: configure
        run: >
          cmake --preset linux-clang-x64${{ env.SAN }}
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          "-DVCPKG_MANIFEST_FEATURES=test;benchmark"
          $MSGBUS_CONFIGURE_FLAGS

      - name: build
        run: cmake --build --preset linux-clang-x64-rel${{ env.SAN }}

      # no smoke runs: both already ran in the plain pass, and a timed benchmark under an
      # instrument would measure the instrument
      - name: test
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
        run: |
          ctest --preset linux-clang-x64${{ env.SAN }}-test -C Release \
            --output-junit test-results.xml

      - name: upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-nightly-linux-clang
          path: build/linux-clang-x64${{ env.SAN }}/test-results.xml
          retention-days: 7
          if-no-files-found: warn

  # a scheduled failure becomes an issue; failure() not always(), so a green nightly stays
  # silent, and only for the cron -- a workflow_dispatch has a human watching its log
  notify:
    name: notify
    needs: [win-msvc, linux-gcc, linux-clang]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # opening an issue needs one more scope than the workflow's `contents: read`
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const day = new Date().toISOString().slice(0, 10);
            const title = `nightly failure ${day}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // one open issue is enough, else the canary files a new spam issue every morning
            const existing = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'nightly',
              per_page: 100,
            });
            if (existing.data.some(i => i.title.startsWith('nightly failure'))) {
              core.info('an open nightly issue already exists, not filing another');
              return;
            }

            await github.rest.issues.create({
              ...context.repo,
              title,
              labels: ['nightly'],
              body: [
                'The nightly canary failed.',
                '',
                'This run builds every vcpkg port from source with today\'s vcpkg tool, so a',
                'failure here is usually a port or a tool regression rather than a defect in this',
                'tree -- ci.yml pins both and is the run that says which of the two it is.',
                '',
                `run: ${runUrl}`,
                `commit: ${context.sha}`,
              ].join('\n'),
            });
